name: Release on Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify versions and extract CHANGELOG
        id: notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --out release-notes.md \
            --repo "${GITHUB_REPOSITORY}"
          test -s release-notes.md
          echo "Release notes preview:"
          sed -n '1,40p' release-notes.md

      - name: Build
        run: pnpm build

      - name: Verify zip exists
        run: test -f Native-translate.zip && ls -lh Native-translate.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Native Translate ${{ steps.notes.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Native-translate.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store
        if: ${{ secrets.CHROME_EXTENSION_ID != '' && secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' }}
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: Native-translate.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
